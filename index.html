<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario 2025</title>
    <link rel="shortcut icon" href="img/calendario-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="calendarios.css">
</head>
<body>




    <div class="calendar-container">

        <div class="calendar-header">
            <button id="prev-month">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 6.414L13.586 5L7 10.586L7 10.586L13.586 16.172L15 14.757L9.414 10.586L15 6.414Z" fill="currentColor"/>
                </svg>
            </button>
            <h2 id="current-month"></h2>
            <button id="next-month">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8.586 16.172L10 17.586L16.586 12L16.586 12L10 6.414L8.586 7.828L14.172 12L8.586 16.172Z" fill="currentColor"/>
                </svg>
            </button>
        </div>
        <table class="calendar">
            <thead>
                <tr>
                    <th>Dom</th>
                    <th>Lun</th>
                    <th>Mar</th>
                    <th>Mié</th>
                    <th>Jue</th>
                    <th>Vie</th>
                    <th>Sáb</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>



    <script src="calendario.js"></script>

</body>
</html>
